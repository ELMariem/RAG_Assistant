services:
  backend:
    build:
      context: ./backend
    image: rag-backend
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SQL_SERVER_CONNECTION_STRING: ${SQL_SERVER_CONNECTION_STRING}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      # Lets the container resolve 'host.docker.internal' to your Windows machine,
      # where SQL Server and Ollama are still running. Docker Desktop usually
      # provides this automatically, but declaring it explicitly makes the
      # compose file portable if this ever runs on native Linux Docker later.
      - "host.docker.internal:host-gateway"
    volumes:
      # Without these, the container only sees its own empty data/documents and
      # chroma_db folders created at build time -- your real PDFs and vector
      # store live on Windows and need to be mounted in explicitly.
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: rag-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped